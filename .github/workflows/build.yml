name: build-apk

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 定位插件目录
        run: |
          if [ -f "$GITHUB_WORKSPACE/luci-app-rebootschedule/Makefile" ]; then
            echo "PKG_DIR=$GITHUB_WORKSPACE/luci-app-rebootschedule" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/Makefile" ]; then
            echo "PKG_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "::error::找不到 Makefile"; exit 1
          fi

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk git gettext unzip zlib1g-dev \
            libncurses-dev rsync cpio python3 file zstd wget ca-certificates

      - name: 下载 SDK
        run: |
          set -x
          BASE=https://downloads.immortalwrt.org/snapshots/targets/airoha/an7581
          PINNED="immortalwrt-sdk-airoha-an7581_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          URL="$PINNED"
          if ! curl -fsIL --retry 2 --max-time 60 "$BASE/$URL" >/dev/null; then
            URL=$(curl -fsSL --max-time 60 "$BASE/" | grep -oE 'immortalwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' | head -1)
          fi
          [ -n "$URL" ] || { echo "::error::没找到 SDK"; exit 1; }
          echo "SDK = $URL"
          curl -fL --retry 3 --retry-delay 5 -o sdk.tar.zst "$BASE/$URL"
          zstd -t sdk.tar.zst
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf sdk.tar.zst -C "$RUNNER_TEMP/sdk" --strip-components=1

      - name: 准备 feeds
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/sdk"
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: 编译插件
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/sdk"
          rm -rf package/luci-app-rebootschedule
          cp -r "$PKG_DIR" package/luci-app-rebootschedule
          ls -la package/luci-app-rebootschedule
          make defconfig 2>&1 | tail -10
          make package/luci-app-rebootschedule/compile V=s 2>&1 | tail -120

      - name: 收集产物
        run: |
          mkdir -p out
          find "$RUNNER_TEMP/sdk/bin" -name 'luci-app-rebootschedule*.apk' -exec cp -v {} out/ \;
          ls -l out
          test -n "$(ls -A out)" || { echo "::error::没产出 apk"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-rebootschedule-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="$TAG"
            PRE=""
            echo "正式版：$TAG"
          else
            TAG="latest"
            TITLE="最新构建（滚动）"
            PRE="--prerelease"
            echo "滚动版：latest"
          fi

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "luci-app-rebootschedule 自动构建

          - 提交：${{ github.sha }}
          - 运行：#${{ github.run_number }}
          - 适用：OpenWrt 25.12+ / apk（apk-tools 3）

          安装：
          \`\`\`sh
          apk add --allow-untrusted ./luci-app-rebootschedule-*.apk
          \`\`\`" \
              $PRE

          # 滚动版才清理旧产物；正式版保留历史
          if [ "$TAG" = "latest" ]; then
            gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | while read -r a; do
              [ -n "$a" ] && gh release delete-asset latest "$a" -y
            done
          fi

          gh release upload "$TAG" out/*.apk --clobber
          echo "=== 当前 release 产物 ==="
          gh release view "$TAG" --json tagName,assets,publishedAt \
            --jq '.tagName, .publishedAt, (.assets[] | "\(.name)  \(.size) bytes")'